name: Update README

# star 数 + 最新文章列表每天自动刷新。
# 数据都来自公开来源（GitHub API、个人站仓库里的 articles.generated.json），不需要任何 Secret。
on:
  schedule:
    - cron: '30 22 * * *' # UTC 22:30 = 北京时间早 6:30，排在个人站构建之后
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 刷新 star 数与文章列表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_readme.py

      - name: 有变化才提交
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: 自动刷新 star 数与文章列表"
            git push
          else
            echo "没有变化，不提交。"
          fi
